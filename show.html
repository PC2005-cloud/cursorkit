<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CursorKit · 效果展示</title>
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<link rel="apple-touch-icon" href="./logo.svg">
<meta name="theme-color" content="#000000">
<style>
  /* ============================================================
     极简展示页：只有黑白切换与动效选择框，其余留白。
     目的是让主题光标与动效成为画面里唯一的视觉内容。

     底色：纯黑 #000 与近纯白 #f5f6f8（纯 #fff 偏刺眼，截图易过曝）。
     注意：这些动效原本为深色背景设计（发光 + 加法混合），
     在近白底上的观感需要实测确认。
     ============================================================ */

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 两套底色：只换底与文字，不做渐变或装饰 */
  :root {
    --ui: 30;                    /* 控件层：低于动效层 */
    --cursor-effect-z: 2147483500;   /* 动效层：盖过控件，光标与拖尾不被切 */
  }

  html[data-bw="black"] {
    color-scheme: dark;
    --bg:  #000000;
    --fg:  #f2f4f8;
    --dim: rgba(255,255,255,.55);
    --line: rgba(255,255,255,.16);
    --surf: rgba(20,20,22,.92);
    --hover: rgba(255,255,255,.10);
    --shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  html[data-bw="white"] {
    color-scheme: light;
    --bg:  #f5f6f8;
    --fg:  #101318;
    --dim: rgba(16,19,24,.55);
    --line: rgba(16,19,24,.16);
    --surf: rgba(255,255,255,.96);
    --hover: rgba(16,19,24,.07);
    --shadow: 0 12px 36px rgba(20,30,60,.14);
  }

  /* 控件层。
     层级安排：让动效层盖过控件（见 :root 的 --cursor-effect-z）。
     控件可点击性不靠 z-index —— 动效层是 pointer-events: none，
     鼠标事件会穿透过去。若把控件抬到动效之上，它那层不透明底
     会把光标与拖尾切掉一块。 */
  #ui {
    position: fixed; left: 50%; bottom: 34px;
    transform: translateX(-50%);
    z-index: var(--ui);
    display: flex; align-items: center; gap: 10px;
    /* 容器不吃事件，只有里面的控件吃 —— 空白处不挡动效的鼠标轨迹 */
    pointer-events: none;
  }
  #ui > * { pointer-events: auto; }

  /* ---------- 黑白切换 ---------- */
  .bw-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 42px; padding: 0 16px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--surf);
    color: var(--fg);
    font-size: 13.5px; font-family: inherit;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background .16s ease, border-color .16s ease;
  }
  .bw-btn:hover { background: var(--hover); }
  .bw-btn .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--line);
    /* 按钮上的小圆点直接显示"当前底色" */
    background: var(--bg);
  }

  /* ---------- 自定义选择框 ---------- */
  .sel { position: relative; }

  .sel-trigger {
    display: inline-flex; align-items: center; gap: 10px;
    height: 42px; min-width: 190px; padding: 0 14px 0 16px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--surf);
    color: var(--fg);
    font-size: 13.5px; font-family: inherit;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background .16s ease, border-color .16s ease;
  }
  .sel-trigger:hover { background: var(--hover); }
  .sel-trigger .name { flex: 1; text-align: left; }
  .sel-trigger .caret {
    width: 8px; height: 8px;
    border-right: 1.5px solid var(--dim);
    border-bottom: 1.5px solid var(--dim);
    transform: translateY(-2px) rotate(45deg);
    transition: transform .18s ease;
  }
  .sel.open .sel-trigger .caret { transform: translateY(2px) rotate(-135deg); }

  .sel-panel {
    position: absolute; bottom: calc(100% + 8px); left: 0;
    width: 100%; max-height: 330px; overflow-y: auto;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surf);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .sel.open .sel-panel { opacity: 1; visibility: visible; transform: none; }

  .sel-panel::-webkit-scrollbar { width: 8px; }
  .sel-panel::-webkit-scrollbar-track { background: transparent; }
  .sel-panel::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 8px;
    border: 2px solid transparent; background-clip: content-box;
  }

  .opt {
    display: block; width: 100%;
    padding: 9px 12px; border: 0; border-radius: 8px;
    background: transparent; color: var(--fg);
    font-size: 13.5px; font-family: inherit; text-align: left;
    transition: background .12s ease;
  }
  .opt:hover { background: var(--hover); }
  .opt.on { font-weight: 650; }
  .opt.on::after { content: ' ·'; color: var(--dim); }
</style>
</head>
<body>

<!-- 动效层由脚本注入 -->

<div id="ui">
  <button class="bw-btn" id="bwBtn" type="button">
    <span class="dot"></span><span id="bwText">切换底色</span>
  </button>

  <div class="sel" id="sel">
    <button class="sel-trigger" id="selTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="name" id="selName">雪花</span>
      <span class="caret"></span>
    </button>
    <div class="sel-panel" id="selPanel" role="listbox"></div>
  </div>
</div>

<script type="module">
  import { EFFECTS } from './src/effects/index.js';

  const NAMES = {
    'cursor-snow': '雪花', 'cursor-ice': '冰晶', 'cursor-pixel': '像素',
    'cursor-sun': '太阳', 'cursor-silk': '丝绸', 'cursor-refract': '光折射',
    'cursor-orb': '光球', 'cursor-geom': '几何体', 'cursor-ball': '彩球',
    'cursor-planet': '星球', 'cursor-mist': '云雾', 'cursor-code': '代码',
    'cursor-rainbow': '彩虹', 'cursor-moon': '月亮', 'cursor-bubble': '气泡',
    'cursor-ink': '水墨', 'cursor-doodle': '涂鸦', 'cursor-firefang': '火牙',
    'cursor-hole': '黑洞', 'cursor-lightning': '闪电', 'cursor-kaleido': '万花筒',
    'cursor-cell': '细胞', 'cursor-fish': '鱼群', 'cursor-firework': '烟火',
    'cursor-radar': '雷达'
  };
  const TAGS = Object.keys(EFFECTS);

  /* ---------- 底色切换 ---------- */
  const bwBtn = document.getElementById('bwBtn');
  const bwText = document.getElementById('bwText');
  let bw = 'black';

  function applyBW(v) {
    bw = v;
    document.documentElement.setAttribute('data-bw', v);
    bwText.textContent = v === 'black' ? '纯黑' : '近白';
  }
  bwBtn.addEventListener('click', () => applyBW(bw === 'black' ? 'white' : 'black'));
  applyBW('black');

  /* ---------- 自定义选择框 ---------- */
  const sel = document.getElementById('sel');
  const trigger = document.getElementById('selTrigger');
  const panel = document.getElementById('selPanel');
  const selName = document.getElementById('selName');

  let current = null;
  let currentTag = TAGS[0];

  TAGS.forEach((tag) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.dataset.tag = tag;
    b.setAttribute('role', 'option');
    b.textContent = NAMES[tag] || tag;
    b.addEventListener('click', () => { mount(tag); closeSel(); });
    panel.appendChild(b);
  });

  function openSel() {
    sel.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
  function closeSel() {
    sel.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  }
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    sel.classList.contains('open') ? closeSel() : openSel();
  });
  // 点击别处收起
  document.addEventListener('click', () => closeSel());
  // Esc 收起
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSel();
  });

  /* ---------- 挂载动效 ---------- */
  function mount(tag) {
    if (current) { current.remove(); current = null; }
    const el = document.createElement(tag);
    document.body.appendChild(el);
    current = el;
    currentTag = tag;

    selName.textContent = NAMES[tag] || tag;
    for (const o of panel.children) o.classList.toggle('on', o.dataset.tag === tag);
  }

  mount(TAGS[0]);
</script>
</body>
</html>
