<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 280" width="100%" height="100%">
  <defs>
    <!-- 背景点阵图案 -->
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1A1F33" />
    </pattern>
    
    <!-- 鼠标主体渐变 -->
    <linearGradient id="mouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2033" />
      <stop offset="100%" stop-color="#0F111A" />
    </linearGradient>
    
    <!-- 动效轨迹渐变（青色到紫色） -->
    <linearGradient id="motionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- 鼠标发光滤镜 -->
    <filter id="mouseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00F2FE" flood-opacity="0.2" />
    </filter>

    <!-- 光标发光滤镜 -->
    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="256" height="280" rx="48" fill="#0B0F19" />
  <rect width="256" height="280" rx="48" fill="url(#dots)" />

  <!-- 装饰性发光点 -->
  <circle cx="200" cy="70" r="3" fill="#00F2FE" opacity="0.6" />
  <circle cx="45" cy="190" r="4" fill="#9D4EDD" opacity="0.6" />
  <circle cx="220" cy="230" r="2.5" fill="#00F2FE" opacity="0.8" />
  <circle cx="60" cy="90" r="2" fill="#9D4EDD" opacity="0.5" />

  <!-- ===== 动效轨迹（背景层） ===== -->
  <!-- 左侧虚线轨迹 -->
  <path d="M 90 200 L 50 120 L 90 40" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 右侧虚线轨迹 -->
  <path d="M 150 200 L 190 120 L 150 40" stroke="#9D4EDD" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 左侧实体动效轨迹（形似 < ） -->
  <path d="M 60 190 L 20 120 L 60 50" stroke="url(#motionGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 右侧实体动效轨迹（形似 > ） -->
  <path d="M 180 190 L 220 120 L 180 50" stroke="url(#motionGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ===== 鼠标主体 ===== -->
  <g filter="url(#mouseGlow)">
    <!-- 鼠标轮廓 -->
    <path d="M 128 50 C 90 50 78 80 78 120 L 78 170 C 78 195 95 205 128 205 C 161 205 178 195 178 170 L 178 120 C 178 80 166 50 128 50 Z" fill="url(#mouseGrad)" stroke="#00F2FE" stroke-width="2" />
    
    <!-- 鼠标底部发光边缘 -->
    <path d="M 78 170 C 78 195 95 205 128 205 C 161 205 178 195 178 170" stroke="url(#motionGrad)" stroke-width="2" fill="none" opacity="0.8" />
  </g>

  <!-- 鼠标内部细节 -->
  <g>
    <!-- 垂直分割线 -->
    <path d="M 128 50 L 128 120" stroke="#00F2FE" stroke-width="1.5" opacity="0.4" />
    <!-- 水平分割线 -->
    <path d="M 78 120 L 178 120" stroke="#00F2FE" stroke-width="1.5" opacity="0.4" />
    
    <!-- 鼠标滚轮 -->
    <rect x="120" y="75" width="16" height="24" rx="8" fill="#0F111A" stroke="#00F2FE" stroke-width="2" />
    <!-- 滚轮纹理 -->
    <line x1="124" y1="85" x2="132" y2="85" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="124" y1="90" x2="132" y2="90" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- 内部动效轨迹（数字感点缀） -->
    <path d="M 128 105 Q 145 130 128 155" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3 5" stroke-linecap="round" />
  </g>

  <!-- ===== 动效光标 ===== -->
  <g filter="url(#cursorGlow)">
    <!-- 光标主体 -->
    <path d="M 170 40 L 210 85 L 192 85 L 202 115 L 192 120 L 182 92 L 162 102 Z" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- 光标点击涟漪动效 -->
  <g>
    <circle cx="170" cy="45" r="12" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8" />
    <circle cx="170" cy="45" r="24" stroke="#00F2FE" stroke-width="1.5" fill="none" opacity="0.5" />
    <circle cx="170" cy="45" r="36" stroke="#00F2FE" stroke-width="1" fill="none" opacity="0.2" />
  </g>

  <!-- ===== 底部开源代码符号（ </> ） ===== -->
  <g stroke="url(#motionGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左尖括号 < -->
    <path d="M 96 240 L 80 250 L 96 260" />
    <!-- 斜杠 / -->
    <path d="M 132 240 L 124 260" />
    <!-- 右尖括号 > -->
    <path d="M 160 240 L 176 250 L 160 260" />
  </g>
</svg>